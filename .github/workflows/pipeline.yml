name: Pipeline

# PR: check.
# Push to main: check -> build. This also fills the Gradle cache that tag runs reuse,
# since a tag run can only restore caches saved on itself or on the default branch.
# Tag vX.Y.Z: check -> build (Shorebird release) -> release (GitHub Release).
# Tag vX.Y.Z-patch.N: check -> patch. Ships the Dart changes to vX.Y.Z over the air.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-patch.[0-9]+']

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - run: tool/check.sh

  build:
    if: github.event_name == 'push' && !contains(github.ref_name, '-patch.')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - uses: shorebird/setup-shorebird@v1
        if: github.ref_type == 'tag'
        with:
          cache: true

      - name: Restore signing key
        env: &signing
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: tool/restore-key.sh

      - name: Build signed APK
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          FLAGS=("--target-platform=android-arm64,android-x64"
            --build-number="${{ github.run_number }}"
            --dart-define=GITHUB_REPO="${{ github.repository }}"
            --dart-define=COMMIT_SHA="$GITHUB_SHA")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            # Tag v1.2.0 -> 1.2.0. A Shorebird release, so later patches can target it.
            shorebird release android --artifact=apk --flutter-version=3.47.9 \
              --build-name="${GITHUB_REF_NAME#v}" --dart-define=APP_ENV=production "${FLAGS[@]}"
          else
            # Main-branch builds are never released, so any name works.
            flutter build apk --release \
              --build-name=0.0.0 --dart-define=APP_ENV=staging "${FLAGS[@]}"
          fi
          mv build/app/outputs/flutter-apk/app-release.apk "cicd-demo-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: cicd-demo-*.apk

  release:
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-patch.')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" cicd-demo-*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "$(git log -1 --format=%s)"

  patch:
    if: github.ref_type == 'tag' && contains(github.ref_name, '-patch.')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: shorebird/setup-shorebird@v1
        with:
          cache: true

      - name: Restore signing key
        env: *signing
        run: tool/restore-key.sh

      - name: Publish Shorebird patch
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # v1.1.0-patch.1 -> release v1.1.0. Its build number is the run number of that tag's run.
          RELEASE="${GITHUB_REF_NAME%-patch.*}"
          BUILD=$(gh run list --workflow pipeline.yml --branch "$RELEASE" --event push \
            --status success --limit 1 --json number --jq '.[0].number')
          if [ -z "$BUILD" ]; then
            echo "::error::No successful run for $RELEASE, so there is no release to patch."
            exit 1
          fi
          # Same defines as the release. Only COMMIT_SHA differs, so the screen shows the fix commit.
          shorebird patch android --release-version="${RELEASE#v}+$BUILD" --track=stable \
            --allow-build-flag-diffs \
            --dart-define=GITHUB_REPO="${{ github.repository }}" \
            --dart-define=APP_ENV=production \
            --dart-define=COMMIT_SHA="$GITHUB_SHA"
