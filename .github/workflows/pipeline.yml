name: Pipeline

# PR: check.
# Push to main: check -> build. This also fills the Gradle cache that tag runs reuse,
# since a tag run can only restore caches saved on itself or on the default branch.
# Tag vX.Y.Z: check -> build -> release.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - run: tool/check.sh

  build:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. Run tool/make-keystore.sh first."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload.jks
          cat > android/key.properties <<PROPS
          storeFile=upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build signed APK
        run: |
          # Tag v1.2.0 -> 1.2.0. Main-branch builds are never released, so any name works.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="0.0.0"; fi
          flutter build apk --release --target-platform android-arm64 \
            --build-name="$NAME" \
            --build-number="${{ github.run_number }}" \
            --dart-define=GITHUB_REPO="${{ github.repository }}"
          mv build/app/outputs/flutter-apk/app-release.apk "cicd-demo-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: cicd-demo-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" cicd-demo-*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "$(git log -1 --format=%s)"
